<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">Afremit education pilot</title><desc id="desc">A school request, payer review, provider evidence, and Afremit verification shown as connected cards.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#001745"/><stop offset="1" stop-color="#0755b8"/></linearGradient><linearGradient id="c" x2="1"><stop stop-color="#81b4ff"/><stop offset="1" stop-color="#d9eaff"/></linearGradient></defs><rect width="1200" height="700" fill="url(#bg)"/><circle cx="1030" cy="110" r="240" fill="#4985ff" opacity=".12"/><circle cx="90" cy="650" r="260" fill="#fff" opacity=".06"/><text x="75" y="103" fill="#a9c9ff" font-family="Arial,sans-serif" font-size="24" letter-spacing="5">AFREMIT / EDUCATION PILOT</text><text x="75" y="190" fill="#fff" font-family="Arial,sans-serif" font-weight="bold" font-size="70">Support with clarity.</text><text x="77" y="238" fill="#c9deff" font-family="Arial,sans-serif" font-size="26">A visible journey from request to reviewed outcome.</text><path d="M240 405H960" stroke="url(#c)" stroke-width="6" stroke-dasharray="10 14"/><g fill="#fff" font-family="Arial,sans-serif"><g><rect x="74" y="355" width="240" height="180" rx="22" fill="#fff"/><text x="100" y="407" fill="#2362bf" font-size="22">01 / PROVIDER</text><text x="100" y="452" fill="#09265a" font-size="31" font-weight="bold">School request</text><text x="100" y="491" fill="#425c82" font-size="20">Fee + condition</text></g><g><rect x="346" y="355" width="240" height="180" rx="22" fill="#fff"/><text x="372" y="407" fill="#2362bf" font-size="22">02 / PAYER</text><text x="372" y="452" fill="#09265a" font-size="31" font-weight="bold">Review</text><text x="372" y="491" fill="#425c82" font-size="20">Test agreement</text></g><g><rect x="618" y="355" width="240" height="180" rx="22" fill="#fff"/><text x="644" y="407" fill="#2362bf" font-size="22">03 / PROVIDER</text><text x="644" y="452" fill="#09265a" font-size="31" font-weight="bold">Evidence</text><text x="644" y="491" fill="#425c82" font-size="20">Allocation note</text></g><g><rect x="890" y="355" width="240" height="180" rx="22" fill="#fff"/><text x="916" y="407" fill="#2362bf" font-size="22">04 / AFREMIT</text><text x="916" y="452" fill="#09265a" font-size="31" font-weight="bold">Verify</text><text x="916" y="491" fill="#425c82" font-size="20">Test release</text></g></g><text x="75" y="631" fill="#c9deff" font-family="Arial,sans-serif" font-size="21">WORKING PILOT  ·  SIMULATED PAYMENTS  ·  NO REAL FUNDS</text></svg>