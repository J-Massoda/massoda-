<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">KioskFlow offline business operations</title><desc id="desc">A low-bandwidth business dashboard showing sales, inventory and synchronization state.</desc>
  <rect width="1600" height="1000" fill="#f8f0df"/><rect width="305" height="1000" fill="#183749"/><g fill="none" stroke="#f6ce62" stroke-width="11" stroke-linecap="round"><path d="M75 100h110v80H75z"/><path d="M95 100V75h70v25"/><circle cx="105" cy="140" r="8" fill="#f6ce62"/><circle cx="155" cy="140" r="8" fill="#f6ce62"/></g><text x="75" y="250" fill="#fff" font-family="Arial" font-size="38" font-weight="700">KioskFlow</text><text x="75" y="290" fill="#a7c5d5" font-family="Arial" font-size="20">Offline SME operations</text><g font-family="Arial" font-size="23" fill="#c2d7e2"><text x="75" y="400">Dashboard</text><text x="75" y="460">Record sale</text><text x="75" y="520">Inventory</text><text x="75" y="580">Sync queue</text><text x="75" y="640">Conflicts</text><text x="75" y="700">Reports</text></g>
  <text x="375" y="110" fill="#186a72" font-family="Arial" font-size="18" font-weight="700" letter-spacing="4">OFFLINE-FIRST OPERATIONS</text><text x="375" y="180" fill="#173345" font-family="Arial" font-size="58" font-weight="700">Business stays open</text><text x="375" y="220" fill="#687983" font-family="Arial" font-size="23">Record work locally. Synchronize when the network returns.</text>
  <g fill="#fff" stroke="#dfd2ba" stroke-width="2"><rect x="375" y="275" width="255" height="145" rx="18"/><rect x="655" y="275" width="255" height="145" rx="18"/><rect x="935" y="275" width="255" height="145" rx="18"/><rect x="1215" y="275" width="255" height="145" rx="18"/></g><g font-family="Arial"><g fill="#6c7e87" font-size="16"><text x="405" y="315">TODAY’S SALES</text><text x="685" y="315">LOW STOCK</text><text x="965" y="315">QUEUED CHANGES</text><text x="1245" y="315">CONFLICTS</text></g><g fill="#173345" font-size="42" font-weight="700"><text x="405" y="375">FCFA 84K</text><text x="685" y="375">3</text><text x="965" y="375">6</text><text x="1245" y="375">1</text></g></g>
  <rect x="375" y="460" width="680" height="390" rx="20" fill="#fff" stroke="#dfd2ba" stroke-width="2"/><text x="415" y="520" fill="#173345" font-family="Arial" font-size="27" font-weight="700">Recent local orders</text><g font-family="Arial" font-size="19" fill="#445d69"><text x="415" y="595">Rice 5kg × 2</text><text x="845" y="595">Queued</text><text x="415" y="665">Cooking oil × 1</text><text x="845" y="665">Synced</text><text x="415" y="735">Soap pack × 3</text><text x="845" y="735">Queued</text></g>
  <rect x="1080" y="460" width="390" height="390" rx="20" fill="#173345"/><text x="1120" y="525" fill="#f6ce62" font-family="Arial" font-size="18" font-weight="700">SYNC STATUS</text><text x="1120" y="595" fill="#fff" font-family="Arial" font-size="36" font-weight="700">Working offline</text><text x="1120" y="640" fill="#b7ced9" font-family="Arial" font-size="20">6 durable events waiting</text><path d="M1120 720h280" stroke="#4b6b7d" stroke-width="14" stroke-linecap="round"/><path d="M1120 720h180" stroke="#f6ce62" stroke-width="14" stroke-linecap="round"/>
</svg>
