<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Sentinel AI agent security command center</title><desc id="desc">A security control plane showing evaluated, approved and blocked AI agent actions.</desc>
  <rect width="1600" height="1000" fill="#f4f6f2"/><rect width="300" height="1000" fill="#14231f"/><path d="M75 65h70l24 25v55l-59 33-59-33V90z" fill="#c8f49c"/><path d="M110 88l25 10v22c0 20-12 32-25 39-13-7-25-19-25-39V98z" fill="none" stroke="#173e32" stroke-width="7"/>
  <text x="75" y="225" fill="#fff" font-family="Arial" font-size="38" font-weight="700">Sentinel</text><text x="75" y="265" fill="#9cc2b5" font-family="Arial" font-size="20">Agent control plane</text><g font-family="Arial" font-size="23" fill="#c0d5ce"><text x="75" y="370">Command center</text><text x="75" y="430">Approval queue</text><text x="75" y="490">Policy studio</text><text x="75" y="550">Audit evidence</text><text x="75" y="610">Incidents</text></g>
  <text x="360" y="105" fill="#16745e" font-family="Arial" font-size="18" font-weight="700" letter-spacing="4">AI AGENT SECURITY SANDBOX</text><text x="360" y="175" fill="#10211e" font-family="Arial" font-size="58" font-weight="700">Command center</text><text x="360" y="215" fill="#66756f" font-family="Arial" font-size="23">Useful capabilities without unchecked authority.</text>
  <g fill="#fff" stroke="#d2ddd8" stroke-width="2"><rect x="360" y="270" width="260" height="150" rx="18"/><rect x="645" y="270" width="260" height="150" rx="18"/><rect x="930" y="270" width="260" height="150" rx="18"/><rect x="1215" y="270" width="260" height="150" rx="18"/></g><g font-family="Arial"><g fill="#65766f" font-size="16"><text x="390" y="310">ACTIONS EVALUATED</text><text x="675" y="310">AUTO-ALLOWED</text><text x="960" y="310">AWAITING APPROVAL</text><text x="1245" y="310">BLOCKED ACTIONS</text></g><g fill="#10211e" font-size="42" font-weight="700"><text x="390" y="375">2,846</text><text x="675" y="375">98%</text><text x="960" y="375">2</text><text x="1245" y="375">37</text></g></g>
  <rect x="360" y="460" width="770" height="400" rx="20" fill="#fff" stroke="#d2ddd8" stroke-width="2"/><text x="400" y="520" fill="#10211e" font-family="Arial" font-size="27" font-weight="700">Policy enforcement activity</text><g fill="#63ad8e"><rect x="450" y="690" width="70" height="100"/><rect x="580" y="630" width="70" height="160"/><rect x="710" y="580" width="70" height="210"/><rect x="840" y="535" width="70" height="255"/><rect x="970" y="610" width="70" height="180"/></g>
  <rect x="1160" y="460" width="315" height="400" rx="20" fill="#fff" stroke="#d2ddd8" stroke-width="2"/><text x="1200" y="520" fill="#10211e" font-family="Arial" font-size="27" font-weight="700">Active agents</text><g font-family="Arial" font-size="20" fill="#27473e"><text x="1200" y="590">Atlas Research</text><text x="1200" y="655">Ledger Copilot</text><text x="1200" y="720">Care Desk</text></g>
</svg>
