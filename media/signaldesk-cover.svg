<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="title desc"><title id="title">SignalDesk concept illustration</title><desc id="desc">Generic sample interface showing a business workflow and three steps, without real customer data.</desc><rect width="960" height="600" fill="#ede8e1"/><rect x="52" y="44" width="856" height="512" rx="24" fill="#f8f5f0" stroke="#d4cbc0"/><rect x="52" y="44" width="856" height="64" rx="24" fill="#222623"/><circle cx="88" cy="75" r="6" fill="#8d806c"/><circle cx="108" cy="75" r="6" fill="#c9baab"/><circle cx="128" cy="75" r="6" fill="#c9baab"/><text x="162" y="83" fill="#f4f0ea" font-family="Arial,sans-serif" font-size="20" font-weight="bold">SignalDesk</text><text x="86" y="160" fill="#252a26" font-family="Arial,sans-serif" font-size="19" font-weight="bold">A clearer next step</text><text x="86" y="191" fill="#62665e" font-family="Arial,sans-serif" font-size="15">Illustrative workflow · fictional example</text><rect x="86" y="226" width="788" height="76" rx="13" fill="#e8e0d5"/><rect x="104" y="245" width="9" height="38" rx="4" fill="#8d806c"/><text x="132" y="258" fill="#272a25" font-family="Arial,sans-serif" font-size="17" font-weight="bold">01  Notice the issue</text><text x="132" y="283" fill="#62665e" font-family="Arial,sans-serif" font-size="14">A familiar operational signal enters the queue</text><rect x="86" y="317" width="788" height="76" rx="13" fill="#eee9e1"/><rect x="104" y="336" width="9" height="38" rx="4" fill="#8d806c"/><text x="132" y="349" fill="#272a25" font-family="Arial,sans-serif" font-size="17" font-weight="bold">02  Review the context</text><text x="132" y="374" fill="#62665e" font-family="Arial,sans-serif" font-size="14">See what is missing and who can act</text><rect x="86" y="408" width="788" height="76" rx="13" fill="#e8e0d5"/><rect x="104" y="427" width="9" height="38" rx="4" fill="#8d806c"/><text x="132" y="440" fill="#272a25" font-family="Arial,sans-serif" font-size="17" font-weight="bold">03  Record the next action</text><text x="132" y="465" fill="#62665e" font-family="Arial,sans-serif" font-size="14">Keep the handoff visible to the team</text></svg>